name: Test CV Web
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start FastAPI server
        run: |
          cd api
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 &
      - name: Wait for API to be ready
        # Đợi cổng 8000 phản hồi, tối đa 10 phút (600000ms)
        run: npx wait-on http://127.0.0.1:8000 --timeout 600000
      - name: Show API logs on failure
        if: failure()
        run: cat api/server.log
      - name: Run Test Unhappy case
        run: |
          npx playwright test tests/unhappy.spec.js
      - name: Run Test Happy case
        run: |
          npx playwright test tests/generated-from-testcase.spec.js