name: Test CV Web
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Start FastAPI server
        run: |
          cd api
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 &
          sleep 10

      - name: Run Test Unhappy case
        run: |
          npx playwright test tests/unhappy.spec.js
      - name: Run Test Happy case
        run: |
          npx playwright test tests/generated-from-testcase.spec.js