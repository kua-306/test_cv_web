<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nhận Diện Động Vật AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bg-gradient-brand {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col text-gray-800">

    <div id="auth-screen" class="flex-1 flex flex-col justify-center items-center p-4 bg-gray-100">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in border border-gray-100">
            <div class="text-center mb-6">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                    <i class="fas fa-paw text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Animal AI</h1>
            </div>

            <div class="flex justify-center mb-6">
                <div id="g_id_onload"
                    data-client_id="624401284648-qg4bapeb16go2ja2dujftalnjb53u0ka.apps.googleusercontent.com"
                    data-callback="handleGoogleCallback" data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
                </div>
            </div>

            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">Hoặc đăng nhập bằng tài khoản</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <div class="flex bg-gray-100 p-1 rounded-lg mb-4">
                <button onclick="switchAuthMode('login')" id="tab-login"
                    class="flex-1 py-2 rounded-md text-sm font-semibold shadow bg-white text-indigo-600 transition-all">Đăng
                    nhập</button>
                <button onclick="switchAuthMode('register')" id="tab-register"
                    class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-indigo-600 transition-all">Đăng
                    ký</button>
            </div>

            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="login-username"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="Tên tài khoản" required>
                <input type="password" id="login-password"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="Mật khẩu" required>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-all">Đăng
                    Nhập</button>
            </form>

            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <input type="text" id="reg-username"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    placeholder="Tên tài khoản mới" required>
                <input type="password" id="reg-password"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none"
                    placeholder="Mật khẩu" required>
                <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg transition-all">Đăng
                    Ký</button>
            </form>
        </div>
    </div>

    <div id="main-screen" class="hidden flex-col min-h-screen bg-gray-50">
        <nav class="bg-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center text-indigo-600 font-bold text-xl"><i class="fas fa-brain mr-2"></i>AI
                    Recognition</div>
                <div class="flex space-x-2">
                    <button onclick="showAppSection('predict')" class="px-3 py-2 text-gray-600 hover:text-indigo-600"><i
                            class="fas fa-camera"></i></button>
                    <button onclick="loadHistory()" class="px-3 py-2 text-gray-600 hover:text-indigo-600"><i
                            class="fas fa-history"></i></button>
                    <button onclick="logout()" class="px-3 py-2 text-red-500"><i
                            class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </nav>

        <div class="flex-1 w-full max-w-md mx-auto py-8 px-4 flex flex-col">
            <div id="section-predict" class="bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
                <div class="bg-gradient-brand p-4 text-center text-white">
                    <h2 class="font-bold">Phân Tích Ảnh</h2>
                </div>
                <div class="p-6">
                    <div class="flex border-b mb-4">
                        <button id="tab-upload" onclick="switchInputMode('upload')"
                            class="flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold">Tải ảnh</button>
                        <button id="tab-camera" onclick="switchInputMode('camera')"
                            class="flex-1 pb-2 text-gray-500">Camera</button>
                    </div>
                    <div id="mode-upload" class="block">
                        <label
                            class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-xl cursor-pointer bg-indigo-50 hover:bg-indigo-100">
                            <i class="fas fa-cloud-upload-alt text-3xl text-indigo-400 mb-2"></i>
                            <span class="text-sm text-gray-500">Chọn ảnh</span>
                            <input id="image-upload" type="file" class="hidden" accept="image/*" />
                        </label>
                    </div>
                    <div id="mode-camera" class="hidden">
                        <video id="video-feed" class="w-full h-48 bg-black rounded-lg mb-2" autoplay
                            playsinline></video>
                        <div class="flex space-x-2">
                            <button id="btn-capture" class="flex-1 bg-indigo-600 text-white py-2 rounded">Chụp</button>
                            <button id="btn-retake" class="hidden flex-1 bg-gray-500 text-white py-2 rounded">Chụp
                                lại</button>
                        </div>
                    </div>
                    <div id="preview-container" class="hidden mt-4">
                        <img id="image-preview" class="w-full h-48 object-contain rounded mb-3 border" />
                        <button id="predict-btn"
                            class="w-full bg-gradient-brand text-white font-bold py-3 rounded-xl shadow-lg">Gửi
                            Server</button>
                        <div id="loading" class="hidden text-center text-indigo-600 mt-2"><i
                                class="fas fa-spinner fa-spin"></i> Đang xử lý...</div>
                    </div>
                    <div id="result-card" class="hidden mt-6 pt-4 border-t">
                        <div id="prediction-list" class="space-y-2"></div>
                    </div>
                </div>
            </div>

            <div id="section-history" class="hidden">
                <h2 class="font-bold text-xl mb-4">Lịch sử</h2>
                <div id="history-loading" class="text-center hidden"><i class="fas fa-spinner fa-spin"></i></div>
                <div id="history-empty" class="hidden text-center text-gray-500">Chưa có dữ liệu.</div>
                <div id="history-list" class="space-y-4"></div>
            </div>
        </div>
    </div>
    <canvas id="canvas-capture" class="hidden"></canvas>

    <script>
        const BASE_URL = "http://127.0.0.1:8000";
        // --- QUAN TRỌNG: THAY BẰNG CLIENT ID CỦA BẠN Ở DƯỚI DÒNG NÀY ---
        const GOOGLE_CLIENT_ID = "624401284648-qg4bapeb16go2ja2dujftalnjb53u0ka.apps.googleusercontent.com";

        // 1. XỬ LÝ GOOGLE LOGIN CALLBACK
        async function handleGoogleCallback(response) {
            // response.credential chứa token Google trả về
            console.log("Google Token:", response.credential);

            try {
                // Gửi token này lên Server mình để đổi lấy JWT App
                const res = await fetch(`${BASE_URL}/google-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();

                if (res.ok && data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    checkAuth();
                    Swal.fire({ icon: 'success', title: 'Đăng nhập Google thành công!', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('Lỗi', data.detail || 'Xác thực thất bại', 'error');
                }
            } catch (err) {
                Swal.fire('Lỗi', 'Không kết nối được Server', 'error');
            }
        }

        // --- CÁC HÀM CŨ (GIỮ NGUYÊN) ---
        let currentFile = null; let stream = null;
        function getToken() { return localStorage.getItem('access_token'); }

        function checkAuth() {
            const token = getToken();
            if (token) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('flex');
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('flex');
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            checkAuth();
            stopCamera();
            // Reload để reset Google button nếu cần
            window.location.reload();
        }

        function switchAuthMode(mode) {
            if (mode === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').className = "flex-1 py-2 rounded-md text-sm font-semibold shadow bg-white text-indigo-600 transition-all";
                document.getElementById('tab-register').className = "flex-1 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-indigo-600 transition-all";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register').className = "flex-1 py-2 rounded-md text-sm font-semibold shadow bg-white text-indigo-600 transition-all";
                document.getElementById('tab-login').className = "flex-1 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-indigo-600 transition-all";
            }
        }

        // Login thường
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            try {
                const res = await fetch(`${BASE_URL}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok && data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    checkAuth();
                    Swal.fire({ icon: 'success', title: 'Thành công', timer: 1000, showConfirmButton: false });
                } else Swal.fire('Lỗi', data.detail, 'error');
            } catch (err) { Swal.fire('Lỗi mạng', '', 'error'); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('reg-username').value;
            const p = document.getElementById('reg-password').value;
            try {
                const res = await fetch(`${BASE_URL}/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (res.ok) { Swal.fire('OK', 'Đăng ký xong', 'success'); switchAuthMode('login'); }
                else { const d = await res.json(); Swal.fire('Lỗi', d.detail, 'error'); }
            } catch (e) { }
        }

        // Navigation App
        function showAppSection(section) {
            const secP = document.getElementById('section-predict');
            const secH = document.getElementById('section-history');
            if (section === 'predict') { secP.classList.remove('hidden'); secH.classList.add('hidden'); }
            else { secP.classList.add('hidden'); secH.classList.remove('hidden'); stopCamera(); }
        }

        // Camera/Upload Logic
        function switchInputMode(mode) {
            stopCamera();
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
            if (mode === 'upload') {
                document.getElementById('mode-upload').classList.remove('hidden');
                document.getElementById('mode-camera').classList.add('hidden');
                document.getElementById('tab-upload').className = "flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold";
                document.getElementById('tab-camera').className = "flex-1 pb-2 text-gray-500";
            } else {
                document.getElementById('mode-camera').classList.remove('hidden');
                document.getElementById('mode-upload').classList.add('hidden');
                document.getElementById('tab-camera').className = "flex-1 pb-2 text-indigo-600 border-b-2 border-indigo-600 font-bold";
                document.getElementById('tab-upload').className = "flex-1 pb-2 text-gray-500";
                startCamera();
            }
        }

        document.getElementById('image-upload').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                currentFile = e.target.files[0];
                document.getElementById('image-preview').src = URL.createObjectURL(currentFile);
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('result-card').classList.add('hidden');
            }
        });

        async function startCamera() {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); document.getElementById('video-feed').srcObject = stream; }
            catch (err) { Swal.fire('Lỗi Cam', '', 'error'); }
        }
        function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
        document.getElementById('btn-capture').onclick = () => {
            const v = document.getElementById('video-feed'); const c = document.getElementById('canvas-capture');
            c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
            c.toBlob(b => {
                currentFile = new File([b], "cam.jpg", { type: "image/jpeg" });
                document.getElementById('image-preview').src = URL.createObjectURL(currentFile);
                document.getElementById('preview-container').classList.remove('hidden'); stopCamera();
            }, 'image/jpeg');
        };

        // Predict
        document.getElementById('predict-btn').onclick = async () => {
            const token = getToken(); if (!token) { logout(); return; }
            const btn = document.getElementById('predict-btn'); const load = document.getElementById('loading');
            btn.classList.add('hidden'); load.classList.remove('hidden'); document.getElementById('result-card').classList.add('hidden');
            const fd = new FormData(); fd.append('file', currentFile);
            try {
                // Gửi Token qua URL
                const res = await fetch(`${BASE_URL}/predict?token=${token}`, { method: 'POST', body: fd });
                const data = await res.json();
                if (res.ok && data.success) {
                    const list = document.getElementById('prediction-list'); list.innerHTML = '';
                    data.predictions.forEach(i => {
                        list.innerHTML += `<div class="flex justify-between font-medium"><span>${i.class}</span><span>${i.confidence}</span></div>
                        <div class="w-full bg-gray-200 h-2 rounded-full"><div class="bg-indigo-600 h-2 rounded-full" style="width:${i.confidence}"></div></div>`;
                    });
                    document.getElementById('result-card').classList.remove('hidden');
                } else if (res.status === 401 || res.status === 422) { logout(); }
                else Swal.fire('Lỗi', data.detail, 'error');
            } catch (e) { Swal.fire('Lỗi Server', '', 'error'); }
            finally { load.classList.add('hidden'); btn.classList.remove('hidden'); }
        };

        // History
        async function loadHistory() {
            showAppSection('history'); const token = getToken(); if (!token) return logout();
            const list = document.getElementById('history-list'); list.innerHTML = '';
            try {
                const res = await fetch(`${BASE_URL}/history?token=${token}`);
                const data = await res.json();
                if (res.ok) {
                    if (data.length === 0) document.getElementById('history-empty').classList.remove('hidden');
                    else {
                        document.getElementById('history-empty').classList.add('hidden');
                        data.forEach(i => {
                            list.innerHTML += `<div class="bg-white p-3 rounded shadow flex gap-3 relative border">
                                <button onclick="delH(${i.id},this)" class="absolute top-2 right-2 text-gray-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                                <img src="${i.image_name}" class="w-20 h-20 object-cover rounded">
                                <div><div class="font-bold text-indigo-700">${i.prediction}</div><div class="text-xs text-gray-500">${new Date(i.timestamp || Date.now()).toLocaleString()}</div></div>
                            </div>`;
                        });
                    }
                }
            } catch (e) { }
        }

        async function delH(id, el) {
            if (!confirm('Xóa?')) return;
            const token = getToken();
            await fetch(`${BASE_URL}/history-delete?token=${token}`, {
                method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id })
            });
            el.closest('div').remove();
        }

        checkAuth();
    </script>
</body>

</html>
